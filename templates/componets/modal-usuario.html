<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>CanvaMarket · Modal de usuario</title>

  <!-- 1) Bootstrap 5.3 -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css">

  <!-- 2) Font Awesome Free 7.3.1 -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fortawesome/fontawesome-free@7.3.1/css/all.min.css">

  <!-- 3) Tipografías de la marca -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:ital,wght@0,500;0,600;1,500&display=swap">

  <!-- 4) Tu hoja de estilos SIEMPRE después de Bootstrap
       (en Flask: {{ url_for('static', filename='css/style.css') }}) -->
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <main class="container" style="padding-block: 80px;">

    <!-- =====================================================
         BOTÓN QUE ABRE LA MODAL
         ===================================================== -->
    <button type="button" class="btn btn-primary btn-user-modal" data-bs-toggle="modal" data-bs-target="#modalUsuario">
      <i class="fa-solid fa-user-plus" aria-hidden="true"></i>
      Nuevo usuario
    </button>

  </main>

  <!-- =====================================================
       MODAL · TABLA `usuario`
       Campos: id, nombre, correo, clave, perfil (+ imagen)
       ===================================================== -->
  <div class="modal fade user-modal" id="modalUsuario" tabindex="-1" aria-labelledby="modalUsuarioLabel" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered modal-dialog-scrollable">
      <div class="modal-content">

        <!-- Header -->
        <div class="modal-header">
          <div class="user-modal__heading">
            <span class="section-eyebrow">Panel · Usuarios</span>
            <h1 class="modal-title fs-5" id="modalUsuarioLabel">Registrar usuario</h1>
          </div>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Cerrar"></button>
        </div>

        <!-- enctype multipart: obligatorio para enviar la imagen -->
        <form id="formUsuario" class="needs-validation" action="/usuario/guardar" method="post" enctype="multipart/form-data" novalidate>

          <!-- Body -->
          <div class="modal-body">

            <!-- id (AUTO_INCREMENT): vacío al crear, con valor al editar -->
            <input type="hidden" id="usuarioId" name="id" value="">

            <div class="row g-3">

              <!-- imagen -->
              <div class="col-12">
                <label class="form-label" for="usuarioImagen">Imagen de perfil</label>
                <div class="user-upload" data-upload>
                  <div class="user-upload__preview">
                    <i class="fa-solid fa-user" aria-hidden="true"></i>
                    <img alt="Vista previa de la imagen de perfil">
                  </div>
                  <div class="user-upload__body">
                    <p class="user-upload__title">
                      <i class="fa-solid fa-cloud-arrow-up" aria-hidden="true"></i>
                      Arrastra tu imagen aquí o selecciónala
                    </p>
                    <p class="user-upload__hint" id="usuarioImagenHelp">JPG, PNG o WEBP · máximo 2&nbsp;MB</p>
                    <input class="form-control" type="file" id="usuarioImagen" name="imagen"
                           accept="image/jpeg, image/png, image/webp" aria-describedby="usuarioImagenHelp">
                    <div class="invalid-feedback">La imagen debe ser JPG, PNG o WEBP y pesar máximo 2&nbsp;MB.</div>
                  </div>
                </div>
              </div>

              <!-- nombre · varchar(150) NOT NULL -->
              <div class="col-md-6">
                <label class="form-label" for="usuarioNombre">Nombre <span class="req">*</span></label>
                <div class="input-group has-validation">
                  <span class="input-group-text"><i class="fa-solid fa-user" aria-hidden="true"></i></span>
                  <input type="text" class="form-control" id="usuarioNombre" name="nombre"
                         placeholder="Ej. Valeria Pérez" maxlength="150" autocomplete="name" required>
                  <div class="invalid-feedback">Escribe el nombre del usuario.</div>
                </div>
              </div>

              <!-- correo · varchar(150) NOT NULL UNIQUE -->
              <div class="col-md-6">
                <label class="form-label" for="usuarioCorreo">Correo <span class="req">*</span></label>
                <div class="input-group has-validation">
                  <span class="input-group-text"><i class="fa-solid fa-envelope" aria-hidden="true"></i></span>
                  <input type="email" class="form-control" id="usuarioCorreo" name="correo"
                         placeholder="nombre@correo.com" maxlength="150" autocomplete="email" required>
                  <div class="invalid-feedback">Ingresa un correo válido.</div>
                </div>
              </div>

              <!-- clave · varchar(200) NOT NULL (se guarda con hash) -->
              <div class="col-md-6">
                <label class="form-label" for="usuarioClave">Contraseña <span class="req">*</span></label>
                <div class="input-group has-validation">
                  <span class="input-group-text"><i class="fa-solid fa-lock" aria-hidden="true"></i></span>
                  <input type="password" class="form-control" id="usuarioClave" name="clave"
                         placeholder="Mínimo 8 caracteres" minlength="8" maxlength="200"
                         autocomplete="new-password" required>
                  <button class="btn btn-outline-secondary user-modal__toggle" type="button"
                          data-toggle-password="#usuarioClave" aria-label="Mostrar contraseña" aria-pressed="false">
                    <i class="fa-solid fa-eye" aria-hidden="true"></i>
                  </button>
                  <div class="invalid-feedback">La contraseña debe tener al menos 8 caracteres.</div>
                </div>
              </div>

              <!-- perfil · char(1) DEFAULT 'U'  (U = usuario, A = administrador) -->
              <div class="col-md-6">
                <span class="form-label d-block" id="usuarioPerfilLabel">Perfil</span>
                <div class="user-role" role="radiogroup" aria-labelledby="usuarioPerfilLabel">
                  <input type="radio" class="btn-check" name="perfil" id="perfilU" value="U" autocomplete="off" checked>
                  <label class="btn user-role__option" for="perfilU">
                    <i class="fa-solid fa-user" aria-hidden="true"></i> Usuario
                  </label>

                  <input type="radio" class="btn-check" name="perfil" id="perfilA" value="A" autocomplete="off">
                  <label class="btn user-role__option" for="perfilA">
                    <i class="fa-solid fa-user-shield" aria-hidden="true"></i> Admin
                  </label>
                </div>
              </div>

            </div>
          </div>

          <!-- Footer -->
          <div class="modal-footer">
            <p class="user-modal__note me-auto"><span class="req">*</span> Campos obligatorios</p>
            <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">
              <i class="fa-solid fa-xmark" aria-hidden="true"></i> Cancelar
            </button>
            <button type="submit" class="btn btn-primary">
              <i class="fa-solid fa-floppy-disk" aria-hidden="true"></i> Guardar usuario
            </button>
          </div>

        </form>
      </div>
    </div>
  </div>

  <!-- Bootstrap JS (incluye Popper) -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>

  <script>
  (() => {
    'use strict';

    const modalEl = document.getElementById('modalUsuario');
    const form    = document.getElementById('formUsuario');
    const MAX_BYTES = 2 * 1024 * 1024;                       // 2 MB
    const TIPOS     = ['image/jpeg', 'image/png', 'image/webp'];

    /* ---------- 1. Mostrar / ocultar contraseña ---------- */
    const togglePassword = (btn, mostrar) => {
      const input = form.querySelector(btn.dataset.togglePassword);
      const icon  = btn.querySelector('i');
      input.type = mostrar ? 'text' : 'password';
      btn.setAttribute('aria-pressed', String(mostrar));
      btn.setAttribute('aria-label', mostrar ? 'Ocultar contraseña' : 'Mostrar contraseña');
      icon.classList.toggle('fa-eye', !mostrar);
      icon.classList.toggle('fa-eye-slash', mostrar);
    };

    form.querySelectorAll('[data-toggle-password]').forEach(btn => {
      btn.addEventListener('click', () => {
        const input = form.querySelector(btn.dataset.togglePassword);
        togglePassword(btn, input.type === 'password');
      });
    });

    /* ---------- 2. Imagen: vista previa + arrastrar y soltar ---------- */
    const zone       = form.querySelector('[data-upload]');
    const fileInput  = zone.querySelector('input[type="file"]');
    const previewImg = zone.querySelector('.user-upload__preview img');
    let objectUrl = null;

    const limpiarImagen = () => {
      if (objectUrl) URL.revokeObjectURL(objectUrl);
      objectUrl = null;
      previewImg.removeAttribute('src');
      zone.classList.remove('has-image');
      fileInput.setCustomValidity('');
      fileInput.classList.remove('is-invalid');
    };

    const procesarImagen = () => {
      const file = fileInput.files[0];
      limpiarImagen();
      if (!file) return;

      if (!TIPOS.includes(file.type) || file.size > MAX_BYTES) {
        fileInput.setCustomValidity('Archivo no válido');
        fileInput.classList.add('is-invalid');
        return;
      }

      objectUrl = URL.createObjectURL(file);
      previewImg.src = objectUrl;
      zone.classList.add('has-image');
    };

    fileInput.addEventListener('change', procesarImagen);

    // Clic en cualquier parte de la zona abre el selector
    zone.addEventListener('click', e => {
      if (e.target !== fileInput) fileInput.click();
    });

    ['dragenter', 'dragover'].forEach(evt =>
      zone.addEventListener(evt, e => {
        e.preventDefault();
        zone.classList.add('is-dragover');
      })
    );
    zone.addEventListener('dragleave', e => {
      if (!zone.contains(e.relatedTarget)) zone.classList.remove('is-dragover');
    });
    zone.addEventListener('drop', e => {
      e.preventDefault();
      zone.classList.remove('is-dragover');
      if (!e.dataTransfer.files.length) return;
      fileInput.files = e.dataTransfer.files;
      procesarImagen();
    });

    /* ---------- 3. Validación de Bootstrap ---------- */
    form.addEventListener('submit', e => {
      if (!form.checkValidity()) {
        e.preventDefault();
        e.stopPropagation();
        form.querySelector(':invalid')?.focus();
      }
      form.classList.add('was-validated');
    });

    /* ---------- 4. Al abrir: foco en el nombre ---------- */
    modalEl.addEventListener('shown.bs.modal', () => {
      form.querySelector('#usuarioNombre').focus();
    });

    /* ---------- 5. Al cerrar: dejar el formulario limpio ---------- */
    modalEl.addEventListener('hidden.bs.modal', () => {
      form.reset();
      form.classList.remove('was-validated');
      limpiarImagen();
      form.querySelectorAll('[data-toggle-password]').forEach(btn => togglePassword(btn, false));
    });
  })();
  </script>
</body>
</html>
