{% extends 'layout.html' %}
{% block titulo %} CanvaMarket — Materiales para artistas {% endblock %}
{% block contenido %}
<header class="site-header">
  <div class="container header-top">
    <a href="#" class="logo">CanvaMarket</a>

    <form class="header-top__search" role="search">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg>
      <input type="search" placeholder="Buscar materiales..." aria-label="Buscar materiales">
    </form>

    <div class="header-actions">
      <button class="icon-btn icon-btn--search" aria-label="Buscar">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg>
      </button>
      <button class="icon-btn" aria-label="Ubicación">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M12 21s-7-6.1-7-11a7 7 0 0 1 14 0c0 4.9-7 11-7 11z"/><circle cx="12" cy="10" r="2.5"/></svg>
      </button>
      <button class="icon-btn" aria-label="Mi cuenta">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><circle cx="12" cy="8" r="3.5"/><path d="M4.5 20c1.7-3.6 5-5.5 7.5-5.5s5.8 1.9 7.5 5.5"/></svg>
      </button>
      <button class="icon-btn icon-btn--cart" aria-label="Carrito de compras">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M4 6h2l1.5 10.5a2 2 0 0 0 2 1.7h7a2 2 0 0 0 2-1.6L20 8H7"/><circle cx="10" cy="21" r="1"/><circle cx="17" cy="21" r="1"/></svg>
        <span class="cart-badge">0</span>
      </button>
      <button class="hamburger" aria-label="Abrir menú" aria-expanded="false">
        <span class="hamburger__box">
          <span class="hamburger__line"></span>
          <span class="hamburger__line"></span>
          <span class="hamburger__line"></span>
        </span>
      </button>
    </div>
  </div>

  <nav class="header-nav" aria-label="Categorías principales">
    <ul class="header-nav__list container">
      <li><a class="header-nav__link" href="#categorias">Pinturas</a></li>
      <li><a class="header-nav__link" href="#categorias">Dibujo</a></li>
      <li><a class="header-nav__link" href="#categorias">Pinceles</a></li>
      <li><a class="header-nav__link" href="#categorias">Papeles</a></li>
      <li><a class="header-nav__link" href="#categorias">Canvas</a></li>
      <li><a class="header-nav__link" href="#productos">Sets</a></li>
      <li><a class="header-nav__link header-nav__link--sale" href="#productos">Ofertas</a></li>
      <li><a class="header-nav__link" href="#comunidad">Inspiración</a></li>
    </ul>
  </nav>
</header>
{% endblock %}
